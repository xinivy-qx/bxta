<!DOCTYPE html>
<html>
<head>
    <title>tignan natin kung pwede k</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 100px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }

        .result {
            font-size: 60px;
            font-weight: bold;
            animation: rainbow 2s infinite;
        }

        @keyframes rainbow {
            0%   { color: red; }
            20%  { color: orange; }
            40%  { color: yellow; }
            60%  { color: green; }
            80%  { color: blue; }
            100% { color: purple; }
        }
    </style>
</head>

<body>

    <h1>baho m tia</h1>

    <form method="POST">

        <label>ilang taon ka na?</label>
        <br><br>

        <input type="number" name="age" required>

        <br><br>

        <button type="submit">CHECK</button>

    </form>

    {% if result %}
        <p class="result">{{ result }}</p>
    {% endif %}

</body>
</html>
